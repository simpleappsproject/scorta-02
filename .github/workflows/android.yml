# Compila un APK di prova di Simple Score in automatico (come per Simple Timer e Simple Finance).
# - A ogni modifica su main e per ogni Pull Request verso main.
# - Sempre: APK di prova, installabile su qualsiasi Android.
# - Se nei Secrets ci sono ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (chiave unica "Simple Apps"):
#   anche il file .aab firmato da caricare su Google Play (artifact "...-play-store").
# Il file si scarica dalla Pull Request (scheda Checks → Android → Summary → Artifacts)
# oppure dalla pagina "Actions" del repository.
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Versione dell'app
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Installa Capacitor
        run: npm ci

      - name: Copia i file web nel progetto Android
        run: npx cap sync android

      - name: Prepara la chiave di firma (se presente)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "Nessuna chiave di firma: creo solo l'APK di prova."
          fi

      - name: Compila APK di prova
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Compila App Bundle firmato per il Play Store
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v5
        with:
          name: simple-score-${{ env.VERSION_NAME }}-${{ github.run_number }}-apk-prova
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: env.SIGNED == 'true'
        with:
          name: simple-score-${{ env.VERSION_NAME }}-${{ github.run_number }}-play-store
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
