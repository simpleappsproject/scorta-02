# Compila un APK di prova di Simple Score in automatico (come per Simple Timer e Simple Finance).
# - A ogni modifica su main e per ogni Pull Request verso main.
# - Sempre: APK di prova, installabile su qualsiasi Android.
# - Se nei Secrets ci sono ANDROID_KEYSTORE_BASE64 e ANDROID_KEYSTORE_PASSWORD (chiave unica "Simple Apps"):
#   anche il file .aab firmato da caricare su Google Play (artifact "...-play-store").
# Il file si scarica dalla Pull Request (scheda Checks → Android → Summary → Artifacts)
# oppure dalla pagina "Actions" del repository.
name: Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', 'store/**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Versione dell'app
        run: echo "VERSION_NAME=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - name: Installa Capacitor
        run: npm ci

      - name: Copia i file web nel progetto Android
        run: npx cap sync android

      - name: Prepara la chiave di firma (se presente)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=true" >> "$GITHUB_ENV"
          else
            echo "Nessuna chiave di firma: creo solo l'APK di prova."
          fi

      - name: Compila APK di prova
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Compila App Bundle firmato per il Play Store
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: upload
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - name: Controllo pre-lancio (permessi, versione Android, librerie native)
        continue-on-error: true
        run: |
          APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          S="$GITHUB_STEP_SUMMARY"
          {
            echo "## Controllo pre-lancio"
            echo "Requisiti di Google Play: Android di destinazione 36 o più, nessuna libreria nativa non allineata a 16 KB."
            echo '```'
            "$BT/aapt2" dump badging "$APK" | grep -E "^package:|^sdkVersion|^targetSdkVersion|^uses-permission" || true
            echo '```'
          } >> "$S"
          T=$("$BT/aapt2" dump badging "$APK" 2>/dev/null | sed -n "s/^targetSdkVersion:'\([0-9]*\)'/\1/p")
          if [ "${T:-0}" -ge 36 ]; then echo "- Android di destinazione: $T ✅" >> "$S"; else echo "- Android di destinazione: $T ❌ (serve 36)" >> "$S"; fi
          FILES="$APK $(ls android/app/build/outputs/bundle/release/*.aab 2>/dev/null)"
          SO=$(for f in $FILES; do unzip -l "$f" | grep -E '\.so$' || true; done)
          if [ -z "$SO" ]; then echo "- Librerie native (.so): nessuna, requisito 16 KB soddisfatto ✅" >> "$S"
          else echo "- Librerie native (.so) trovate: controllare l'allineamento a 16 KB ⚠️" >> "$S"; echo '```' >> "$S"; echo "$SO" >> "$S"; echo '```' >> "$S"; fi
          cat "$S"

      - uses: actions/upload-artifact@v5
        with:
          name: simple-score-${{ env.VERSION_NAME }}-${{ github.run_number }}-apk-prova
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - uses: actions/upload-artifact@v5
        if: env.SIGNED == 'true'
        with:
          name: simple-score-${{ env.VERSION_NAME }}-${{ github.run_number }}-play-store
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
